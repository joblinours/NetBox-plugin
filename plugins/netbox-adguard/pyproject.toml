[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-adguard"
version = "0.1.0"
description = "NetBox plugin: imports AdGuard Home DNS rewrites (local domain names), links them to IPs and hosts, and mirrors them into netbox-plugin-dns."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Joblin" }]
requires-python = ">=3.12"
dependencies = ["requests>=2.31"]

[project.urls]
Repository = "https://github.com/joblinours/NetBox-plugin"

[tool.setuptools.packages.find]
include = ["netbox_adguard*"]

[tool.setuptools.package-data]
netbox_adguard = ["templates/**/*"]
