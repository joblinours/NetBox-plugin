[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-cmdb-mcp"
version = "0.1.0"
description = "NetBox plugin: read-only MCP server (streamable HTTP) so Claude can query the homelab CMDB (hosts, IPs, ports, URLs, containers)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Joblin" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/joblinours/NetBox-plugin"

[tool.setuptools.packages.find]
include = ["netbox_cmdb_mcp*"]
