[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-cmdb-export"
version = "0.1.0"
description = "NetBox plugin: export the CMDB as Markdown, PDF, JSON, or a topology graph (Mermaid, PNG, SVG)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Joblin" }]
requires-python = ">=3.12"
dependencies = ["fpdf2>=2.8"]

[project.urls]
Repository = "https://github.com/joblinours/NetBox-plugin"

[tool.setuptools.packages.find]
include = ["netbox_cmdb_export*"]

[tool.setuptools.package-data]
netbox_cmdb_export = ["templates/**/*"]
