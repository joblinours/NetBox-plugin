[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-docker-inventory"
version = "0.1.0"
description = "NetBox plugin: Docker hosts, compose stacks, containers, networks and published ports, pushed by an agent running on each Docker host."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Joblin" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/joblinours/NetBox-plugin"

[tool.setuptools.packages.find]
include = ["netbox_docker_inventory*"]

[tool.setuptools.package-data]
netbox_docker_inventory = ["templates/**/*"]
