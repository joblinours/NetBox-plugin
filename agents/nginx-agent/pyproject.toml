[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdb-nginx-agent"
version = "0.1.0"
description = "Discovers Nginx virtual hosts on the reverse proxy and pushes them to NetBox through Diode"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Joblin" }]
requires-python = ">=3.10"
dependencies = ["netboxlabs-diode-sdk>=1.14,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cmdb-nginx-agent = "cmdb_nginx_agent.cli:main"

[tool.setuptools.packages.find]
include = ["cmdb_nginx_agent*"]
