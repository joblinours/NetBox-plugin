[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdb-docker-agent"
version = "0.1.0"
description = "Reads a Docker host (containers, compose stacks, networks, ports, volumes) and pushes it to NetBox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Joblin" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cmdb-docker-agent = "cmdb_docker_agent.cli:main"

[tool.setuptools.packages.find]
include = ["cmdb_docker_agent*"]
