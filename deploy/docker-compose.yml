# CMDB homelab — NetBox + Diode, single Portainer stack.
#
# No file has to be copied to the Docker host: configuration lives in the
# images (built by GitHub Actions, pulled from GHCR) and in the stack
# variables (see stack.env.example, generated by tools/generate-env.py).
#
# Published on the host: NetBox UI/API (NETBOX_PORT) and the Diode gRPC entry
# point (DIODE_GRPC_PORT). Everything else stays on the internal network.
#
# Stack CMDB homelab — NetBox + Diode, une seule stack Portainer.
# Aucun fichier à déposer sur l'hôte : la configuration est dans les images
# et dans les variables de la stack.

name: cmdb

x-netbox-image: &netbox-image ghcr.io/joblinours/netbox-cmdb:${CMDB_IMAGE_TAG:-latest}

x-netbox-env: &netbox-env
  # Database / cache
  DB_HOST: postgres
  DB_NAME: netbox
  DB_USER: netbox
  DB_PASSWORD: ${NETBOX_DB_PASSWORD:?NETBOX_DB_PASSWORD is required}
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD:?NETBOX_REDIS_PASSWORD is required}
  REDIS_CACHE_HOST: valkey
  REDIS_CACHE_DATABASE: "1"
  REDIS_CACHE_PASSWORD: ${NETBOX_REDIS_PASSWORD}
  # NetBox core
  SECRET_KEY: ${NETBOX_SECRET_KEY:?NETBOX_SECRET_KEY is required}
  API_TOKEN_PEPPER_1: ${NETBOX_API_TOKEN_PEPPER:?NETBOX_API_TOKEN_PEPPER is required}
  ALLOWED_HOSTS: ${NETBOX_ALLOWED_HOSTS:-*}
  CSRF_TRUSTED_ORIGINS: ${NETBOX_CSRF_TRUSTED_ORIGINS:-}
  TIME_ZONE: ${TZ:-Europe/Paris}
  METRICS_ENABLED: "false"
  GRANIAN_WORKERS: ${NETBOX_WORKERS:-4}
  # First start: the admin account is created only if it does not exist yet.
  SKIP_SUPERUSER: "false"
  SUPERUSER_NAME: ${NETBOX_ADMIN_USER:-admin}
  SUPERUSER_EMAIL: ${NETBOX_ADMIN_EMAIL:-admin@example.com}
  SUPERUSER_PASSWORD: ${NETBOX_ADMIN_PASSWORD:?NETBOX_ADMIN_PASSWORD is required}
  # Diode plugin
  DIODE_TARGET_INTERNAL: grpc://diode-gateway:80/diode
  DIODE_TARGET_DISPLAY: grpc://${DOCKER_HOST_IP:-127.0.0.1}:${DIODE_GRPC_PORT:-8081}/diode
  DIODE_CLIENT_SECRET_NETBOX_TO_DIODE: ${DIODE_CLIENT_SECRET_NETBOX_TO_DIODE:?DIODE_CLIENT_SECRET_NETBOX_TO_DIODE is required}
  # Proxmox (proxmox2netbox endpoint, provisioned at start-up)
  PROXMOX_HOST: ${PROXMOX_HOST:-}
  PROXMOX_PORT: ${PROXMOX_PORT:-8006}
  PROXMOX_USER: ${PROXMOX_USER:-netbox@pve}
  PROXMOX_TOKEN_NAME: ${PROXMOX_TOKEN_NAME:-}
  PROXMOX_TOKEN_VALUE: ${PROXMOX_TOKEN_VALUE:-}
  PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-false}
  PROXMOX_SYNC_INTERVAL: ${PROXMOX_SYNC_INTERVAL:-1440}
  # Cloudflare Tunnel plugin
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_TUNNEL_IDS: ${CLOUDFLARE_TUNNEL_IDS:-}
  CLOUDFLARE_SYNC_INTERVAL: ${CLOUDFLARE_SYNC_INTERVAL:-1440}
  NGINX_PROXY_HOSTS: ${NGINX_PROXY_HOSTS:-}
  # Source health / service accounts (one token per consumer)
  SOURCE_MAX_AGE_HOURS: ${SOURCE_MAX_AGE_HOURS:-26}
  CMDB_TOKEN_ORB_AGENT: ${CMDB_TOKEN_ORB_AGENT:-}
  CMDB_TOKEN_NGINX_AGENT: ${CMDB_TOKEN_NGINX_AGENT:-}
  CMDB_TOKEN_ZABBIX: ${CMDB_TOKEN_ZABBIX:-}
  CMDB_TOKEN_DOCKER_AGENT: ${CMDB_TOKEN_DOCKER_AGENT:-}
  CMDB_TOKEN_MCP: ${CMDB_TOKEN_MCP:-}
  # AdGuard Home (DNS rewrites -> NetBox + netbox-plugin-dns)
  ADGUARD_URLS: ${ADGUARD_URLS:-}
  ADGUARD_USERNAME: ${ADGUARD_USERNAME:-}
  ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:-}
  ADGUARD_VERIFY_SSL: ${ADGUARD_VERIFY_SSL:-true}
  ADGUARD_SYNC_INTERVAL: ${ADGUARD_SYNC_INTERVAL:-1440}
  ADGUARD_SYNC_NETBOX_DNS: ${ADGUARD_SYNC_NETBOX_DNS:-true}
  ADGUARD_AUTO_CREATE_ZONES: ${ADGUARD_AUTO_CREATE_ZONES:-true}
  # Docker hosts expected to report (one agent each), for health / Zabbix
  DOCKER_AGENT_HOSTS: ${DOCKER_AGENT_HOSTS:-${DOCKER_AGENT_HOST_NAME:-docker}}
  # MCP server
  MCP_DEFAULT_PREFIX: ${MCP_DEFAULT_PREFIX:-192.168.1.0/24}
  MCP_RESERVED_IP_RANGES: ${MCP_RESERVED_IP_RANGES:-}

services:
  # ---------------------------------------------------------------- NetBox
  netbox:
    image: *netbox-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment: *netbox-env
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${NETBOX_PORT:-8000}:8080"
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login/ >/dev/null || exit 1"]
      start_period: 900s
      interval: 15s
      timeout: 5s
      retries: 5

  netbox-worker:
    image: *netbox-image
    restart: unless-stopped
    depends_on:
      netbox:
        condition: service_healthy
    environment: *netbox-env
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    healthcheck:
      test: ["CMD-SHELL", "ps -aux | grep -v grep | grep -q rqworker || exit 1"]
      start_period: 20s
      interval: 15s
      timeout: 3s

  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${NETBOX_DB_PASSWORD}
    volumes:
      - netbox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d netbox -U netbox"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: docker.io/valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["sh", "-c", "valkey-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
    volumes:
      - netbox-valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------------------- Diode
  diode-gateway:
    image: ghcr.io/joblinours/netbox-cmdb-diode-gateway:${CMDB_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - diode-auth
      - diode-ingester
      - diode-reconciler
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${DIODE_GRPC_PORT:-8081}:80"

  diode-ingester:
    image: docker.io/netboxlabs/diode-ingester:${DIODE_VERSION:-2.4.0}
    restart: unless-stopped
    environment:
      REDIS_HOST: diode-redis
      REDIS_PORT: "6378"
      REDIS_PASSWORD: ${DIODE_REDIS_PASSWORD:?DIODE_REDIS_PASSWORD is required}
      REDIS_USERNAME: ""
      LOGGING_LEVEL: ${DIODE_LOG_LEVEL:-INFO}
      TELEMETRY_ENVIRONMENT: cmdb
      TELEMETRY_METRICS_EXPORTER: none
      TELEMETRY_TRACES_EXPORTER: none
    depends_on:
      - diode-redis
      - diode-reconciler

  diode-reconciler:
    image: docker.io/netboxlabs/diode-reconciler:${DIODE_VERSION:-2.4.0}
    restart: unless-stopped
    environment:
      REDIS_HOST: diode-redis
      REDIS_PORT: "6378"
      REDIS_PASSWORD: ${DIODE_REDIS_PASSWORD}
      REDIS_USERNAME: ""
      NETBOX_DIODE_PLUGIN_API_BASE_URL: http://netbox:8080/api/plugins/diode
      NETBOX_DIODE_PLUGIN_SKIP_TLS_VERIFY: "false"
      NETBOX_DIODE_PLUGIN_API_TIMEOUT_SECONDS: "60"
      LOGGING_LEVEL: ${DIODE_LOG_LEVEL:-INFO}
      MIGRATION_ENABLED: "true"
      POSTGRES_HOST: diode-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_NAME: diode
      POSTGRES_USER: diode
      POSTGRES_PASSWORD: ${DIODE_DB_PASSWORD:?DIODE_DB_PASSWORD is required}
      DIODE_AUTH_TOKEN_URL: http://diode-auth:8080/token
      DIODE_TO_NETBOX_CLIENT_ID: diode-to-netbox
      DIODE_TO_NETBOX_CLIENT_SECRET: ${DIODE_CLIENT_SECRET_DIODE_TO_NETBOX:?DIODE_CLIENT_SECRET_DIODE_TO_NETBOX is required}
      TELEMETRY_ENVIRONMENT: cmdb
      TELEMETRY_METRICS_EXPORTER: none
      TELEMETRY_TRACES_EXPORTER: none
    depends_on:
      diode-redis:
        condition: service_started
      diode-postgres:
        condition: service_healthy

  diode-redis:
    image: docker.io/redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --dir /data --save 60 1 --requirepass \"$$REDIS_PASSWORD\" --port 6378"]
    environment:
      REDIS_PASSWORD: ${DIODE_REDIS_PASSWORD}
    volumes:
      - diode-redis:/data

  diode-postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DIODE_POSTGRES_ADMIN_PASSWORD:?DIODE_POSTGRES_ADMIN_PASSWORD is required}
      DIODE_DB_PASSWORD: ${DIODE_DB_PASSWORD}
      HYDRA_DB_PASSWORD: ${HYDRA_DB_PASSWORD:?HYDRA_DB_PASSWORD is required}
      # Creates the diode and hydra databases on the very first start (inline,
      # so that no init file has to exist on the host).
      POSTGRES_INIT_SCRIPT: |
        #!/bin/bash
        set -euo pipefail
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<-EOSQL
          CREATE USER diode WITH PASSWORD '$${DIODE_DB_PASSWORD}';
          CREATE DATABASE diode OWNER diode;
          CREATE USER hydra WITH PASSWORD '$${HYDRA_DB_PASSWORD}';
          CREATE DATABASE hydra OWNER hydra;
        EOSQL
    command:
      - sh
      - -c
      - printf '%s\n' "$$POSTGRES_INIT_SCRIPT" > /docker-entrypoint-initdb.d/01-init.sh && chmod +x /docker-entrypoint-initdb.d/01-init.sh && exec docker-entrypoint.sh postgres
    volumes:
      - diode-postgres:/var/lib/postgresql/data
      - type: tmpfs
        target: /docker-entrypoint-initdb.d
        tmpfs:
          size: 1000000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d diode -U diode && pg_isready -q -t 2 -d hydra -U hydra"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  hydra-migrate:
    image: docker.io/oryd/hydra:v26.2.0
    restart: on-failure
    command: ["migrate", "sql", "up", "-e", "--yes"]
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD}@diode-postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
      URLS_SELF_ISSUER: http://127.0.0.1:4444
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:?HYDRA_SECRETS_SYSTEM is required}
    depends_on:
      diode-postgres:
        condition: service_healthy

  hydra:
    image: docker.io/oryd/hydra:v26.2.0
    restart: unless-stopped
    # --dev only relaxes the HTTPS requirement of the issuer; Hydra is reachable
    # from the internal stack network only.
    command: ["serve", "all", "--dev"]
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD}@diode-postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
      STRATEGIES_ACCESS_TOKEN: jwt
      STRATEGIES_REFRESH_TOKEN: jwt
      STRATEGIES_JWT_SCOPE_CLAIM: both
      TTL_ACCESS_TOKEN: 1h
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public
      URLS_SELF_ISSUER: http://127.0.0.1:4444
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM}
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  diode-auth:
    image: docker.io/netboxlabs/diode-auth:${DIODE_VERSION:-2.4.0}
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
      OAUTH2_PUBLIC_SERVER_URL: http://hydra:4444
      OAUTH2_ADMIN_SERVER_URL: http://hydra:4445
      TELEMETRY_ENVIRONMENT: cmdb
      TELEMETRY_METRICS_EXPORTER: none
      TELEMETRY_TRACES_EXPORTER: none
    depends_on:
      diode-bootstrap:
        condition: service_completed_successfully

  # Creates / updates the OAuth2 clients from the variables at every start.
  diode-bootstrap:
    image: ghcr.io/joblinours/netbox-cmdb-diode-bootstrap:${CMDB_IMAGE_TAG:-latest}
    restart: on-failure
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
      DIODE_CLIENT_SECRET_DIODE_TO_NETBOX: ${DIODE_CLIENT_SECRET_DIODE_TO_NETBOX}
      DIODE_CLIENT_SECRET_NETBOX_TO_DIODE: ${DIODE_CLIENT_SECRET_NETBOX_TO_DIODE}
      DIODE_CLIENT_ID_ORB_AGENT: orb-agent
      DIODE_CLIENT_SECRET_ORB_AGENT: ${DIODE_CLIENT_SECRET_ORB_AGENT:?DIODE_CLIENT_SECRET_ORB_AGENT is required}
      DIODE_CLIENT_ID_NGINX_AGENT: nginx-agent
      DIODE_CLIENT_SECRET_NGINX_AGENT: ${DIODE_CLIENT_SECRET_NGINX_AGENT:-}
    depends_on:
      - hydra

  # ------------------------------------------------------------ Network scan
  # Host networking so nmap sees the LAN; it reaches Diode and NetBox through
  # their published ports on the Docker host.
  orb-agent:
    image: ghcr.io/joblinours/netbox-cmdb-orb-agent:${CMDB_IMAGE_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      DIODE_TARGET: grpc://${DOCKER_HOST_IP:-127.0.0.1}:${DIODE_GRPC_PORT:-8081}/diode
      DIODE_CLIENT_ID: orb-agent
      DIODE_CLIENT_SECRET: ${DIODE_CLIENT_SECRET_ORB_AGENT}
      ORB_AGENT_NAME: ${ORB_AGENT_NAME:-cmdb-orb-agent}
      SCAN_TARGETS: ${SCAN_TARGETS:-192.168.1.0/24}
      SCAN_SCHEDULE: ${SCAN_SCHEDULE:-0 3 * * *}
      SCAN_TOP_PORTS: ${SCAN_TOP_PORTS:-1000}
      SCAN_TIMEOUT_MINUTES: ${SCAN_TIMEOUT_MINUTES:-120}
      SCAN_STARTUP: ${SCAN_STARTUP:-true}
      ORB_DISCOVERY_PORT: ${ORB_DISCOVERY_PORT:-8073}
      NETBOX_URL: http://${DOCKER_HOST_IP:-127.0.0.1}:${NETBOX_PORT:-8000}
      NETBOX_TOKEN: ${CMDB_TOKEN_ORB_AGENT:-}
    depends_on:
      - diode-gateway
      - netbox

  # ---------------------------------------------------------- Docker inventory
  # Describes this Docker host (containers, stacks, internal networks, volumes).
  # Read-only Docker socket; for other Docker hosts use deploy/docker-agent.compose.yml.
  docker-agent:
    image: ghcr.io/joblinours/netbox-cmdb-docker-agent:${CMDB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NETBOX_URL: http://netbox:8080
      NETBOX_TOKEN: ${CMDB_TOKEN_DOCKER_AGENT:-}
      DOCKER_AGENT_HOST_NAME: ${DOCKER_AGENT_HOST_NAME:-docker}
      DOCKER_AGENT_ADDRESSES: ${DOCKER_HOST_IP:-}
      DOCKER_AGENT_INTERVAL: ${DOCKER_AGENT_INTERVAL:-3600}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      netbox:
        condition: service_healthy

volumes:
  netbox-media:
  netbox-reports:
  netbox-scripts:
  netbox-postgres:
  netbox-valkey:
  diode-redis:
  diode-postgres:
